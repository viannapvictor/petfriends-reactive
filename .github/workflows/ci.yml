name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven

    - name: Build and Test
      run: mvn clean verify

    - name: Generate JaCoCo Badge
      id: jacoco
      uses: cicirello/jacoco-badge-generator@v2
      with:
        jacoco-csv-file: >
          petfriends-almoxarifado/target/site/jacoco/jacoco.csv
          petfriends-transporte/target/site/jacoco/jacoco.csv
        badges-directory: .github/badges
        generate-branches-badge: true
        generate-summary: true

    - name: Upload JaCoCo coverage report
      uses: codecov/codecov-action@v3
      with:
        files: >
          ./petfriends-almoxarifado/target/site/jacoco/jacoco.xml,
          ./petfriends-transporte/target/site/jacoco/jacoco.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: true

    - name: Commit and push badge
      if: github.event_name == 'push' && github.ref == 'refs/heads/master'
      run: |
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'
        git add .github/badges/*.svg
        git diff --quiet && git diff --staged --quiet || (git commit -m "[ci skip] Update coverage badges" && git push)
