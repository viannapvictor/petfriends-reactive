apiVersion: v1
kind: Service
metadata:
  name: elasticsearch-service
  namespace: petfriends
spec:
  type: ClusterIP
  clusterIP: None
  selector:
    app: elasticsearch
  ports:
  - port: 9200
    targetPort: 9200
    protocol: TCP
    name: rest
  - port: 9300
    targetPort: 9300
    protocol: TCP
    name: inter-node