apiVersion: v1
kind: ConfigMap
metadata:
  name: logstash-config
  namespace: petfriends
data:
  logstash.yml: |
    http.host: "0.0.0.0"
    xpack.monitoring.enabled: false

  logstash.conf: |
    input {
      tcp {
        port => 5000
        codec => json_lines
      }
    }

    filter {
      # Parse timestamp
      date {
        match => [ "timestamp", "ISO8601" ]
        target => "@timestamp"
      }

      # Extract trace information
      if [traceId] {
        mutate {
          add_field => { "trace_id" => "%{traceId}" }
        }
      }

      if [spanId] {
        mutate {
          add_field => { "span_id" => "%{spanId}" }
        }
      }

      # Add service name
      if [logger_name] =~ /com\.petfriends\.almoxarifado/ {
        mutate {
          add_field => { "service" => "petfriends-almoxarifado" }
        }
      } else if [logger_name] =~ /com\.petfriends\.transporte/ {
        mutate {
          add_field => { "service" => "petfriends-transporte" }
        }
      }

      # Parse level_value to severity
      if [level_value] {
        if [level_value] >= 40000 {
          mutate { add_field => { "severity" => "ERROR" } }
        } else if [level_value] >= 30000 {
          mutate { add_field => { "severity" => "WARN" } }
        } else if [level_value] >= 20000 {
          mutate { add_field => { "severity" => "INFO" } }
        } else {
          mutate { add_field => { "severity" => "DEBUG" } }
        }
      }
    }

    output {
      elasticsearch {
        hosts => ["elasticsearch-service:9200"]
        index => "petfriends-logs-%{+YYYY.MM.dd}"
      }
    }