apiVersion: v1
kind: ConfigMap
metadata:
  name: almoxarifado-config
  namespace: petfriends
data:
  SERVER_PORT: "8082"
  SPRING_R2DBC_URL: "r2dbc:postgresql://postgres-service:5432/almoxarifado_db"
  SPRING_FLYWAY_URL: "jdbc:postgresql://postgres-service:5432/almoxarifado_db"
  SPRING_CLOUD_STREAM_KAFKA_BINDER_BROKERS: "kafka-service:9093"
  LOGGING_LEVEL_ROOT: "INFO"
  LOGGING_LEVEL_COM_PETFRIENDS_ALMOXARIFADO: "DEBUG"
  MANAGEMENT_ZIPKIN_TRACING_ENDPOINT: "http://zipkin-service:9411/api/v2/spans"
  LOGSTASH_HOST: "logstash-service"
  LOGSTASH_PORT: "5000"

