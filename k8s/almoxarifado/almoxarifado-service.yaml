apiVersion: v1
kind: Service
metadata:
  name: almoxarifado-service
  namespace: petfriends
spec:
  selector:
    app: almoxarifado
  type: LoadBalancer
  ports:
  - port: 80
    targetPort: 8082
    protocol: TCP
    name: http
---
apiVersion: v1
kind: Service
metadata:
  name: almoxarifado-internal
  namespace: petfriends
spec:
  selector:
    app: almoxarifado
  type: ClusterIP
  ports:
  - port: 8082
    targetPort: 8082
    protocol: TCP
    name: http

