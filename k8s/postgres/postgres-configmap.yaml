apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-config
  namespace: petfriends
data:
  init-databases.sh: |
    #!/bin/bash
    set -e
    
    psql -v ON_ERROR_STOP=1 --username "$POSTGRES_USER" <<-EOSQL
        CREATE DATABASE almoxarifado_db;
        CREATE DATABASE transporte_db;
        GRANT ALL PRIVILEGES ON DATABASE almoxarifado_db TO postgres;
        GRANT ALL PRIVILEGES ON DATABASE transporte_db TO postgres;
    EOSQL

